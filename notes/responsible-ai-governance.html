<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsible AI Governance | Juliette Faivre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0b2d47;
      --bg: #f7fbfd;
      --surface: rgba(255,255,255,0.76);
      --border: rgba(7,24,39,0.08);
      --text: #1d1d1f;
      --text-2: #424245;
      --text-3: #6e6e73;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 28px 96px;
    }

    .back-link {
      color: var(--text-3);
      font-size: 14px;
      text-decoration: none;
    }

    .back-link:hover { color: #168fc2; }

    article {
      margin-top: 38px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .note-image {
      width: 100%;
      aspect-ratio: 16 / 7;
      object-fit: cover;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #e6f5fa;
      margin-bottom: 30px;
    }

    .note-date {
      color: var(--text-3);
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
    }

    .dek {
      color: var(--text-2);
      font-size: 18px;
      line-height: 1.65;
      margin-bottom: 34px;
    }

    p {
      color: var(--text-2);
      font-size: 16px;
      margin-bottom: 18px;
    }

    footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px;
      border-top: 1px solid var(--border);
      color: var(--text-3);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../index.html#thoughts">Back to Thoughts</a>

    <article>
      <img class="note-image" src="../assets/note-ai-governance.svg" alt="" />
      <div class="note-date">May 2026</div>
      <h1>Responsible AI Governance</h1>
      <p>Work in progress.</p>
    </article>
  </main>

  <footer>Juliette Faivre &middot; Thoughts</footer>
</body>
</html>
