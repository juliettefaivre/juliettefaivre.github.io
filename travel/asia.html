<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asia | Juliette Faivre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root { --rose: #168fc2; --bg: #f7fbfd; --border: rgba(7,24,39,0.08); --text: #1d1d1f; --text-2: #424245; --text-3: #6e6e73; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    main { max-width: 940px; margin: 0 auto; padding: 64px 28px 96px; }
    .back-link { color: var(--text-3); font-size: 14px; text-decoration: none; }
    .back-link:hover { color: var(--rose); }
    header { margin-top: 38px; padding-top: 28px; border-top: 1px solid var(--border); }
    h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(2.3rem, 5vw, 3.4rem); font-weight: 500; line-height: 1.1; margin-bottom: 16px; }
    p { max-width: 680px; color: var(--text-2); font-size: 16px; margin-bottom: 28px; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .gallery img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); background: #d8f0f7; }
    footer { max-width: 940px; margin: 0 auto; padding: 28px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 13px; }
    @media (max-width: 720px) { .gallery { grid-template-columns: 1fr; } main { padding: 48px 20px 72px; } }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../index.html#personal">Back to Personal</a>
    <header>
      <h1>Asia</h1>
      <p>A personal gallery for photographs from travels, study experiences, and the places I will keep adding over time.</p>
    </header>
    <div class="gallery">
      <img src="../assets/travel-asia.svg" alt="" />
      <img src="../assets/travel-asia.svg" alt="" />
      <img src="../assets/travel-asia.svg" alt="" />
    </div>
  </main>
  <footer>Juliette Faivre &middot; Personal</footer>
</body>
</html>
